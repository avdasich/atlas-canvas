name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
      - name: Test editor and migrations
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Test SQLite storage
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag must be $expectedTag; update the app version before creating a new release."
          }

      - name: Include WebView2 for offline installation
        shell: pwsh
        run: |
          '{"bundle":{"windows":{"webviewInstallMode":{"type":"offlineInstaller"}}}}' |
            Set-Content -Path src-tauri/tauri.windows-offline.conf.json -Encoding utf8

      - name: Build installer and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Atlas Canvas v__VERSION__ — Windows preview
          releaseBody: |
            Test build for Windows x64.
            Download the file ending in -setup.exe from Assets and install Atlas Canvas.
            The installer includes WebView2 for offline installation.
            Canvas data is stored locally on each computer and is not synchronized.
            This build is unsigned. Windows testing is still required before a stable release.
          releaseDraft: true
          prerelease: true
          args: --bundles nsis --config src-tauri/tauri.windows-offline.conf.json
