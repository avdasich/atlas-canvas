<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Место для скриншота 09: Настройте атмосферу</title>
  <desc id="desc">Снежное переливание и блок с настройками эффекта. Заглушка для будущего снимка приложения.</desc>
  <rect width="1600" height="900" rx="28" fill="#f4f6f8"/>
  <rect x="40" y="40" width="1520" height="820" rx="20" fill="#ffffff" stroke="#c8d1dc" stroke-width="2" stroke-dasharray="12 10"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="683" y="270" width="234" height="46" rx="23" fill="#e9eef4"/>
    <text x="800" y="300" font-size="18" font-weight="700" fill="#52657b">СКРИНШОТ 09</text>
    <text x="800" y="410" font-size="46" font-weight="700" fill="#26384e">Настройте атмосферу</text>
    <text x="800" y="475" font-size="25" fill="#5e7085">Снежное переливание и блок с настройками эффекта.</text>
    <text x="800" y="565" font-size="22" fill="#8a96a5">Здесь будет ваш снимок приложения</text>
    <text x="800" y="760" font-size="18" fill="#8a96a5">Atlas Canvas</text>
  </g>
</svg>
